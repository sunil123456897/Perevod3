services:
  translation-studio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: translation-studio
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - ./data:/app/data
